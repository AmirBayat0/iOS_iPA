name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get
        working-directory: Waiter_POS70_new

      - name: CocoaPods repo update
        run: pod repo update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        working-directory: Waiter_POS70_new

      - name: Prepare Payload dir
        run: mkdir -p Payload
        working-directory: Waiter_POS70_new/build/ios/iphoneos

      - name: Move app into Payload
        run: mv Runner.app Payload
        working-directory: Waiter_POS70_new/build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: Waiter_POS70_new/build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Waiter_POS70_new/build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"

name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Firebase Config File
        run: |
          # البحث عن فولدر ios/Runner في أي مكان وتنزيل الملف فيه
          TARGET_DIR=$(find . -name "Runner" -type d -path "*/ios/*" | head -n 1)
          echo "${{ secrets.FIREBASE_IOS_CONFIG }}" | base64 --decode > "$TARGET_DIR/GoogleService-Info.plist"

      - name: Install Dependencies
        run: |
          flutter pub get
          # البحث عن فولدر ios وتشغيل pod install جواه
          IOS_DIR=$(find . -name "ios" -type d | head -n 1)
          cd "$IOS_DIR"
          
          # لو مفيش Podfile، هنخليه يعمل واحد مبدئي
          if [ ! -f "Podfile" ]; then
            echo "Podfile not found, creating a default one..."
            flutter build ios --no-codesign --config-only
          fi
          
          # تعديل الـ Deployment Target لـ 13.0
          sed -i '' "s/# platform :ios, '9.0'/platform :ios, '13.0'/g" Podfile
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" Podfile
          
          pod install

      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Create IPA (The Hack)
        run: |
          # البحث عن الـ .app اللي اتعمله build
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FlutterIpaExport.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: FlutterIpaExport.ipa
          overwrite: true
